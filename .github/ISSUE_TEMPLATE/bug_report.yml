name: Bug report
description: Something in the extension does not work, or works differently from the README
labels: [bug, needs triage]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Syntax highlighting (grammar)
        - Slides outline view
        - Dev server (start, stop, status bar)
        - Preview panel
        - Slide commands (move, duplicate, new, go to)
        - Export
        - Settings
        - Packaging or install
        - Something else
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Say what you did, what you expected and what you got instead. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal slides.md
      description: The smallest deck that shows the problem. Paste it, or link a repository.
      render: markdown
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: From the Extensions view, or the version in package.json.
    validations:
      required: true
  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      description: 'Help > About, for example 1.95.0. Say if you use a fork, a remote window or a web editor.'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system, Node.js version and slide.ng version
      placeholder: Ubuntu 24.04, Node 22.23.3, slide.ng 0.1.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: The slide.ng terminal, the Output panel, or the console of the developer tools.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues.
          required: true
        - label: I read the "Limits you should know" section of the README.
          required: true
